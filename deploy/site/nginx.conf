# Replaces nginx's stock conf.d/default.conf. Port 8080 is Scaleway's default container
# port; if you change it here, change `port` on the container in infra/main.tf too.
server {
    listen      8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Scaleway's health probe hits this. It has to sit OUTSIDE basic auth: point the probe
    # at any authenticated path and every check comes back 401, the container never reports
    # healthy, and the deploy fails with nothing obviously wrong in the container logs.
    location = /_health {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The site is private. Comment these two lines and the htpasswd COPY in the Dockerfile
    # to make it public.
    auth_basic           "mtbrrrr";
    auth_basic_user_file /etc/nginx/htpasswd;

    gzip            on;
    gzip_min_length 512;
    gzip_types      text/css application/javascript application/manifest+json image/svg+xml;

    # Nothing here is content-hashed, so every asset has to revalidate; with ETags that is a
    # 304 in the common case. This is mainly about sw.js — a long max-age there would leave
    # browsers running an old service worker, and since that worker serves the app shell
    # from its own cache, the app could pin itself to a stale version indefinitely.
    add_header Cache-Control "no-cache";

    location / {
        try_files $uri $uri/ =404;
    }
}
