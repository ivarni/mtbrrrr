# Imported into the site block by Caddyfile's `import {$SITE_AUTH_SNIPPET:...}` when auth is
# enabled (the default). This is the privacy gate — the map is private. {$SITE_PASSWORD_HASH}
# is a bcrypt hash from `caddy hash-password`; {$SITE_USER}/{$SITE_PASSWORD_HASH} are
# substituted when Caddy tokenizes this file during import. See .env.example / README.md.
# Referenced by path in Caddyfile (the import default) and .env.example — rename in lockstep.
basic_auth {
	{$SITE_USER} {$SITE_PASSWORD_HASH}
}
