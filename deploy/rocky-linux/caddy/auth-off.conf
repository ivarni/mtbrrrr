# Imported into the site block when SITE_AUTH_SNIPPET=/etc/caddy/auth-off.conf — the site is
# served publicly, no basic auth. Intentionally directive-free: an imported file inlines its
# tokens where the `import` line sits, so this contributes nothing to the site block.
# SITE_USER / SITE_PASSWORD_HASH are unused in this mode.
# Referenced by path in .env.example (the auth-off value) — rename in lockstep.
