<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b3a2b" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>mtbrrrr</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    :root { --bg: #1b3a2b; --panel: rgba(20,20,20,.82); --fg: #fff; --accent: #4ade80; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
      font-family: -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    #map { position: absolute; inset: 0; }

    /* Control panel, bottom so it stays reachable one-handed */
    #panel {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      background: linear-gradient(to top, rgba(0,0,0,.55), transparent);
      pointer-events: none;
    }
    #panel > * { pointer-events: auto; }
    button, label.btn {
      background: var(--panel); color: var(--fg); border: 1px solid rgba(255,255,255,.18);
      border-radius: 22px; padding: 12px 16px; font-size: 15px; font-weight: 600;
      backdrop-filter: blur(8px); cursor: pointer; min-height: 46px; display: inline-flex;
      align-items: center; gap: 6px; user-select: none;
    }
    button:active, label.btn:active { background: var(--accent); color: #06210f; }
    button[aria-pressed="true"] { background: var(--accent); color: #06210f; border-color: var(--accent); }
    input[type=file] { display: none; }

    #status {
      position: absolute; top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      background: var(--panel); color: var(--fg); padding: 8px 14px; border-radius: 20px;
      font-size: 13px; backdrop-filter: blur(8px); max-width: 90vw; text-align: center;
      opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
    }
    #status.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status"></div>
  <div id="panel">
    <button id="locate" title="Center on my location">📍 Locate</button>
    <button id="trails" aria-pressed="false" title="Load MTB trails in view">🚵 Trails</button>
    <label class="btn" for="gpx" title="Load a GPX file">📈 GPX</label>
    <input type="file" id="gpx" accept=".gpx,application/gpx+xml" />
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
