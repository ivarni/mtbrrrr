<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b3a2b" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <title>mtbrrrr</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    :root { --bg: #1b3a2b; --panel: rgba(20,20,20,.82); --fg: #fff; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000;
      font-family: -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    #map { position: absolute; inset: 0; }

    /* Compass cone under MapLibre's location dot; points up (north) at rotation 0. */
    .heading-cone {
      width: 90px; height: 90px; pointer-events: none;
      background: radial-gradient(circle at 50% 100%, rgba(29,161,242,.7), rgba(29,161,242,0) 100%);
      clip-path: polygon(50% 100%, 18% 0, 82% 0);
      transform-origin: 50% 100%;
    }
    .maplibregl-user-location-dot { z-index: 1; }

    #status {
      position: absolute; top: calc(66px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      background: var(--panel); color: var(--fg); padding: 8px 14px; border-radius: 20px;
      font-size: 13px; backdrop-filter: blur(8px); max-width: 90vw; text-align: center;
      opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap;
    }
    #status.show { opacity: 1; }

    .trail-picker { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; }
    .trail-picker button { font: inherit; font-size: 14px; text-align: left; padding: 8px 10px;
      border: 0; border-radius: 6px; background: #f3f4f6; cursor: pointer; }
    .trail-picker button:hover { background: #ffe4f1; }

    /* Trail search: a pill at the top, results in a card under it, the picked trail at the bottom. */
    .maplibregl-ctrl-top-left { top: calc(58px + env(safe-area-inset-top)); }
    .panel { background: var(--panel); color: var(--fg); backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
    #search { position: absolute; z-index: 3; top: calc(8px + env(safe-area-inset-top)); left: 10px; right: 10px;
      max-width: 480px; margin: 0; }
    .search-pill { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 6px 0 14px; border-radius: 22px; }
    .search-pill svg { flex: none; opacity: .7; }
    #search-input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: none; color: inherit;
      font: inherit; font-size: 16px; /* 16px keeps iOS from zooming in on focus */ }
    #search-input::placeholder { color: rgba(255,255,255,.6); }
    #search-input::-webkit-search-cancel-button { display: none; }
    #search-clear { flex: none; width: 34px; height: 34px; border: 0; border-radius: 17px; background: none;
      color: inherit; font-size: 22px; line-height: 1; opacity: .7; cursor: pointer; }
    #search-results { margin-top: 8px; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column;
      /* Ends above the on-screen keyboard: --vvh tracks the visual viewport. */
      max-height: calc(var(--vvh, 100dvh) - 70px - env(safe-area-inset-top)); }
    #search-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; overscroll-behavior: contain; }
    #search-list li + li { border-top: 1px solid rgba(255,255,255,.08); }
    .result { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; border: 0;
      background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .result:hover, .result:focus-visible { background: rgba(255,255,255,.08); outline: 0; }
    .result-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .result-name { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { font-size: 12px; color: #d1d5db; }
    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 999px;
      background: rgba(255,255,255,.1); font-size: 11px; color: #e5e7eb; }
    .chip::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--grade); }
    .spark { flex: none; width: 84px; height: 34px; }
    .spark path:first-child, .profile path:first-child { fill: rgba(255,111,181,.2); }
    .spark path:last-child, .profile path:last-child { fill: none; stroke: #ff6fb5; stroke-width: 1.5;
      stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    #search-footer { margin: 0; padding: 9px 14px; font-size: 11px; color: #9ca3af;
      border-top: 1px solid rgba(255,255,255,.08); }
    #trail-card { position: absolute; z-index: 2; left: 10px; right: 10px; max-width: 480px;
      bottom: calc(28px + env(safe-area-inset-bottom)); padding: 14px 16px; border-radius: 16px;
      display: flex; flex-direction: column; gap: 10px; }
    .stats { display: flex; justify-content: space-between; }
    .stats b { display: block; font-size: 18px; }
    .stats span { font-size: 11px; color: #9ca3af; }
    .stats { align-items: flex-start; }
    .icon-button { flex: none; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0;
      border-radius: 16px; background: rgba(255,255,255,.1); color: inherit; cursor: pointer; }
    #trail-pill { position: absolute; z-index: 2; left: 10px; bottom: calc(28px + env(safe-area-inset-bottom));
      display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px 0 16px; border: 0;
      border-radius: 20px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    .profile-wrap { position: relative; touch-action: none; cursor: crosshair; user-select: none; -webkit-user-select: none; }
    .profile { display: block; width: 100%; height: 60px; }
    .grade-bar { display: flex; gap: 1px; height: 3px; margin-top: 4px; border-radius: 1.5px; overflow: hidden; }
    .axis { display: flex; justify-content: space-between; margin-top: 4px; font-size: 10px; color: #9ca3af; }
    .cursor { position: absolute; top: 0; height: 60px; border-left: 1px solid rgba(255,255,255,.85); pointer-events: none; }
    .cursor::after { content: ''; position: absolute; left: -5.5px; top: calc(var(--y) - 5px); width: 10px; height: 10px;
      border-radius: 50%; background: #ff6fb5; box-shadow: 0 0 0 2px #fff; }
    .cursor-tip { position: absolute; left: 0; bottom: calc(100% + 8px); display: flex; flex-direction: column;
      align-items: center; padding: 4px 9px; border-radius: 8px; background: #fff; color: #111827;
      font-size: 11px; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
    .cursor-tip b { font-size: 15px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status"></div>
  <form id="search" role="search" hidden>
    <div class="search-pill panel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
        stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search-input" type="search" placeholder="Søk etter stier" aria-label="Søk etter stier"
        autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" />
      <button id="search-clear" type="button" aria-label="Tøm søket" hidden>×</button>
    </div>
    <div id="search-results" class="panel" hidden>
      <ul id="search-list"></ul>
      <p id="search-footer"></p>
    </div>
  </form>
  <div id="trail-card" class="panel" hidden>
    <div class="stats">
      <div><b id="card-length"></b><span>Lengde</span></div>
      <div><b id="card-ascent"></b><span>Stigning</span></div>
      <div><b id="card-descent"></b><span>Nedstigning</span></div>
      <button id="card-min" class="icon-button" type="button" aria-label="Minimer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </div>
    <div class="profile-wrap" id="card-profile-wrap">
      <svg class="profile" id="card-profile" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="grade-bar" id="card-grade-bar"></div>
      <div class="axis"><span>0</span><span id="card-axis-end"></span></div>
      <div class="cursor" id="card-cursor" hidden><div class="cursor-tip" id="card-cursor-tip"></div></div>
    </div>
    <div class="chips" id="card-grades"></div>
  </div>
  <button id="trail-pill" class="panel" type="button" aria-label="Vis detaljer om stien" hidden>
    <span id="pill-text"></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
  </button>

  <!-- Fetch app.js's libraries in parallel with app.js instead of after it. -->
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/+esm" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/pmtiles@4.3.0/+esm" />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/fflate@0.8.2/+esm" />
  <script type="module" src="./app.js"></script>
</body>
</html>
